<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Life Tracker</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b25;
      --surface-2: #21253256;
      --border: #2a2f3f;
      --text: #e6e8ef;
      --muted: #8b91a6;
      --accent: #7c5cff;
      --accent-hover: #9479ff;

      --status-cleared: #22c55e;
      --status-playing: #3b82f6;
      --status-planned: #f97316;

      --status-cleared-bg: rgba(34, 197, 94, 0.12);
      --status-playing-bg: rgba(59, 130, 246, 0.12);
      --status-planned-bg: rgba(249, 115, 22, 0.12);

      --radius: 10px;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }

    .hidden { display: none !important; }
    .muted { color: var(--muted); font-size: 13px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #161927 0%, #0f1117 100%);
    }

    .brand h1 { margin: 0; font-size: 22px; }
    .brand .tagline { margin: 4px 0 0 0; color: var(--muted); font-size: 13px; }

    .profile-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .profile-bar label { font-size: 13px; color: var(--muted); }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 24px;
      padding: 24px 32px;
      align-items: start;
    }

    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }

    .form-card, .library, .settings-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .settings-panel {
      margin: 16px 32px 0;
    }
    .settings-panel h2 { margin-top: 0; }
    .settings-panel .row {
      display: flex;
      gap: 8px;
    }
    .settings-panel .help {
      color: var(--muted);
      font-size: 13px;
      margin: 4px 0 12px;
    }

    h2 { margin: 0 0 16px 0; font-size: 17px; }

    input, select, textarea, button {
      font: inherit;
      color: var(--text);
    }

    input[type="text"], input[type="search"], select, textarea, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus, input[type="search"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea { resize: vertical; font-family: inherit; }

    button {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.ghost:hover { background: var(--surface-2); }
    button.ghost.danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }
    button.ghost.danger:hover { background: rgba(239, 68, 68, 0.08); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .lookup-row { display: flex; gap: 8px; }
    .lookup-row input { flex: 1; }

    .lookup-results {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 280px;
      overflow-y: auto;
    }
    .lookup-result {
      display: flex;
      gap: 10px;
      padding: 8px;
      background: var(--surface-2);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      align-items: center;
    }
    .lookup-result:hover { border-color: var(--accent); }
    .lookup-result img {
      width: 64px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      background: #000;
    }
    .lookup-result .meta { font-size: 12px; color: var(--muted); }
    .lookup-result strong { display: block; }

    .screenshot-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .screenshot-preview .thumb {
      position: relative;
      width: 90px;
      height: 60px;
    }
    .screenshot-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .screenshot-preview .remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      padding: 0;
      font-size: 14px;
      background: #ef4444;
      border-radius: 50%;
      line-height: 1;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .library-header h2 { margin: 0; }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filters input, .filters select { min-width: 140px; }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .stat-pill {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
    }
    .stat-pill.cleared { color: var(--status-cleared); background: var(--status-cleared-bg); border-color: var(--status-cleared); }
    .stat-pill.playing { color: var(--status-playing); background: var(--status-playing-bg); border-color: var(--status-playing); }
    .stat-pill.planned { color: var(--status-planned); background: var(--status-planned-bg); border-color: var(--status-planned); }
    .stat-pill.total { color: var(--muted); }

    .game-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .game-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s;
    }
    .game-card:hover { transform: translateY(-2px); }
    .game-card.status-cleared { border-left-color: var(--status-cleared); }
    .game-card.status-playing { border-left-color: var(--status-playing); }
    .game-card.status-planned { border-left-color: var(--status-planned); }

    .game-card .cover {
      width: 100%;
      height: 130px;
      background-size: cover;
      background-position: center;
      background-color: #000;
    }
    .game-card .body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .game-card h3 { margin: 0 0 6px 0; font-size: 15px; }
    .game-card .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.status-cleared { color: var(--status-cleared); background: var(--status-cleared-bg); border-color: var(--status-cleared); }
    .badge.status-playing { color: var(--status-playing); background: var(--status-playing-bg); border-color: var(--status-playing); }
    .badge.status-planned { color: var(--status-planned); background: var(--status-planned-bg); border-color: var(--status-planned); }

    .game-card .info { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .game-card .desc {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 8px 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-card .shots {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .game-card .shots img {
      width: 56px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .game-card .card-actions {
      margin-top: auto;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .game-card .card-actions button,
    .game-card .card-actions a {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
    }
    .game-card .card-actions .youtube {
      background: #ff0033;
      color: white;
    }
    .game-card .card-actions .youtube:hover { background: #cc0029; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
    }

    footer {
      padding: 16px 32px 24px;
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>🎮 Game Life Tracker</h1>
      <p class="tagline">클리어 · 플레이 중 · 플레이 예정 게임을 한 눈에</p>
    </div>
    <div class="profile-bar">
      <label for="profileSelect">프로필</label>
      <select id="profileSelect"></select>
      <button id="newProfileBtn" type="button" class="ghost">＋ 새 프로필</button>
      <button id="deleteProfileBtn" type="button" class="ghost danger">프로필 삭제</button>
      <button id="settingsBtn" type="button" class="ghost">⚙ 설정</button>
    </div>
  </header>

  <section id="settingsPanel" class="settings-panel hidden">
    <h2>설정</h2>
    <label for="rawgKey">RAWG API 키 (선택)</label>
    <p class="help">
      기본 내장 키로 바로 동작합니다. 본인 키를 사용하고 싶다면 아래에 입력하세요 —
      <a href="https://rawg.io/apidocs" target="_blank" rel="noreferrer noopener">무료 발급 받기</a>.
      비워두면 다시 기본 키로 돌아갑니다.
    </p>
    <div class="row">
      <input type="text" id="rawgKey" placeholder="RAWG API key" />
      <button id="saveRawgKey" type="button">저장</button>
    </div>
    <p class="muted" id="rawgKeyStatus"></p>
  </section>

  <main>
    <section class="form-card">
      <h2>새 게임 추가</h2>
      <form id="gameForm" class="game-form">
        <div class="field">
          <label for="title">게임명 *</label>
          <input type="text" id="title" required placeholder="예: Tekken 8 / 철권 8 (입력하면 자동 검색)" autocomplete="off" />
          <div id="lookupResults" class="lookup-results"></div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="status">상태 *</label>
            <select id="status" required>
              <option value="planned">플레이 예정</option>
              <option value="playing">플레이 중</option>
              <option value="cleared">클리어</option>
            </select>
          </div>

          <div class="field">
            <label for="platform">플랫폼 *</label>
            <select id="platform" required>
              <option value="">선택하세요</option>
              <option>PC (Steam)</option>
              <option>PC (Epic)</option>
              <option>PC (GOG)</option>
              <option>PC (Microsoft Store)</option>
              <option>PlayStation 5</option>
              <option>PlayStation 4</option>
              <option>Xbox Series X|S</option>
              <option>Xbox One</option>
              <option>Nintendo Switch</option>
              <option>Nintendo Switch 2</option>
              <option>Steam Deck</option>
              <option>iOS</option>
              <option>Android</option>
              <option>Arcade</option>
              <option>기타</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="genres">장르</label>
            <input type="text" id="genres" placeholder="액션, RPG (자동 채움 가능)" />
          </div>
          <div class="field">
            <label for="released">발매일</label>
            <input type="text" id="released" placeholder="YYYY-MM-DD" />
          </div>
        </div>

        <div class="field">
          <label for="description">설명 / 기본 정보</label>
          <textarea id="description" rows="3" placeholder="자동 채움 또는 직접 입력"></textarea>
        </div>

        <div class="field">
          <label for="note">메모</label>
          <textarea id="note" rows="2" placeholder="클리어 일자, 감상 등"></textarea>
        </div>

        <div class="field">
          <label for="screenshots">스크린샷 (여러 장 선택 가능)</label>
          <input type="file" id="screenshots" accept="image/*" multiple />
          <div id="screenshotPreview" class="screenshot-preview"></div>
        </div>

        <input type="hidden" id="editingId" />
        <input type="hidden" id="coverImage" />

        <div class="actions">
          <button type="submit" id="submitBtn">추가</button>
          <button type="button" id="resetBtn" class="ghost">초기화</button>
        </div>
      </form>
    </section>

    <section class="library">
      <div class="library-header">
        <h2>내 라이브러리</h2>
        <div class="filters">
          <input type="search" id="searchInput" placeholder="🔍 게임명/장르 검색" />
          <select id="filterStatus">
            <option value="all">전체 상태</option>
            <option value="cleared">클리어</option>
            <option value="playing">플레이 중</option>
            <option value="planned">플레이 예정</option>
          </select>
          <select id="filterPlatform">
            <option value="all">전체 플랫폼</option>
          </select>
        </div>
      </div>

      <div class="stats" id="stats"></div>

      <div id="gameList" class="game-list"></div>
      <p id="emptyState" class="empty hidden">아직 등록된 게임이 없습니다. 위 폼에서 첫 게임을 추가해보세요.</p>
    </section>
  </main>

  <footer>
    <p class="muted">데이터는 이 브라우저에 저장됩니다 (LocalStorage). 프로필별로 분리되어 있어요.</p>
  </footer>

  <script>
    // === Storage keys ===
    const KEYS = {
      profiles: 'gametracker:profiles',
      currentProfile: 'gametracker:currentProfile',
      rawgKey: 'gametracker:rawgKey',
      data: (profile) => `gametracker:profile:${profile}`,
    };

    // 내장 기본 RAWG 키 (공유용). 사용자가 설정 패널에서 본인 키를 입력하면 그쪽이 우선.
    const DEFAULT_RAWG_KEY = 'cde46377c7d74bbd88402d2b9f825547';
    const getRawgKey = () => localStorage.getItem(KEYS.rawgKey) || DEFAULT_RAWG_KEY;

    // === Localization ===
    // RAWG 장르 라벨은 종류가 한정적이라 정적 사전으로 즉시 변환
    const GENRE_KO = {
      'Action': '액션',
      'Indie': '인디',
      'Adventure': '어드벤처',
      'RPG': 'RPG',
      'Role-Playing Games (RPG)': 'RPG',
      'Strategy': '전략',
      'Shooter': '슈터',
      'Casual': '캐주얼',
      'Simulation': '시뮬레이션',
      'Puzzle': '퍼즐',
      'Arcade': '아케이드',
      'Platformer': '플랫포머',
      'Racing': '레이싱',
      'Massively Multiplayer': '대규모 멀티플레이어',
      'Sports': '스포츠',
      'Fighting': '격투',
      'Family': '가족',
      'Board Games': '보드 게임',
      'Educational': '교육',
      'Card': '카드',
    };
    const translateGenre = (name) => GENRE_KO[name] || name;
    const translateGenres = (list) => (list || []).map((g) => translateGenre(typeof g === 'string' ? g : g.name));

    // 설명은 자유 텍스트라 MyMemory 무료 번역 API 사용 (키 불필요, 익명 5000 단어/일)
    async function translateChunk(text) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`;
      try {
        const res = await fetch(url);
        if (!res.ok) return text;
        const json = await res.json();
        return (json.responseData && json.responseData.translatedText) || text;
      } catch {
        return text;
      }
    }

    async function translateToKorean(text) {
      if (!text) return text;
      if (!/[a-zA-Z]/.test(text)) return text;          // 영문이 없으면 스킵
      if (/[가-힣]/.test(text)) return text;             // 이미 한글이 섞여 있으면 스킵

      // MyMemory 요청 당 약 500자 한도라 문장 단위로 분할
      const MAX = 480;
      if (text.length <= MAX) return translateChunk(text);
      const sentences = text.match(/[^.!?]+[.!?]+\s*/g) || [text];
      const chunks = [];
      let cur = '';
      for (const s of sentences) {
        if ((cur + s).length > MAX) {
          if (cur) chunks.push(cur);
          cur = s;
        } else {
          cur += s;
        }
      }
      if (cur) chunks.push(cur);
      const out = await Promise.all(chunks.map(translateChunk));
      return out.join(' ');
    }

    // === State ===
    let state = {
      profiles: [],
      currentProfile: null,
      games: [],
      screenshotsBuffer: [],
    };

    // === Utilities ===
    const $ = (id) => document.getElementById(id);
    const uid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

    function loadProfiles() {
      const raw = localStorage.getItem(KEYS.profiles);
      return raw ? JSON.parse(raw) : [];
    }

    function saveProfiles(list) {
      localStorage.setItem(KEYS.profiles, JSON.stringify(list));
    }

    function loadGames(profile) {
      if (!profile) return [];
      const raw = localStorage.getItem(KEYS.data(profile));
      return raw ? JSON.parse(raw) : [];
    }

    function saveGames() {
      if (!state.currentProfile) return;
      localStorage.setItem(KEYS.data(state.currentProfile), JSON.stringify(state.games));
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(s) {
      return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function statusLabel(s) {
      return { cleared: '클리어', playing: '플레이 중', planned: '플레이 예정' }[s] || s;
    }

    // === Profiles ===
    function refreshProfileSelect() {
      const sel = $('profileSelect');
      sel.innerHTML = '';
      state.profiles.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === state.currentProfile) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function switchProfile(name) {
      state.currentProfile = name;
      localStorage.setItem(KEYS.currentProfile, name);
      state.games = loadGames(name);
      renderAll();
    }

    function createProfile(name) {
      name = (name || '').trim();
      if (!name) return;
      if (state.profiles.includes(name)) {
        alert('이미 존재하는 프로필 이름입니다.');
        return;
      }
      state.profiles.push(name);
      saveProfiles(state.profiles);
      refreshProfileSelect();
      switchProfile(name);
    }

    function deleteCurrentProfile() {
      if (!state.currentProfile) return;
      if (state.profiles.length <= 1) {
        alert('마지막 프로필은 삭제할 수 없습니다.');
        return;
      }
      if (!confirm(`프로필 "${state.currentProfile}" 와 모든 게임 데이터를 삭제할까요?`)) return;
      localStorage.removeItem(KEYS.data(state.currentProfile));
      state.profiles = state.profiles.filter((p) => p !== state.currentProfile);
      saveProfiles(state.profiles);
      refreshProfileSelect();
      switchProfile(state.profiles[0]);
    }

    // === RAWG lookup ===
    // RAWG는 영문 타이틀이 우선이라 한글 쿼리는 영어로 번역 후 검색
    async function toEnglish(text) {
      if (!/[가-힣]/.test(text)) return text;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`;
      try {
        const res = await fetch(url);
        if (!res.ok) return text;
        const json = await res.json();
        return (json.responseData && json.responseData.translatedText) || text;
      } catch {
        return text;
      }
    }

    async function rawgSearch(query) {
      const key = getRawgKey();
      // page_size 40 = RAWG 응답 최대치
      const url = `https://api.rawg.io/api/games?key=${encodeURIComponent(key)}&search=${encodeURIComponent(query)}&page_size=40`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`RAWG ${res.status}`);
        const json = await res.json();
        return json.results || [];
      } catch (err) {
        console.warn('RAWG 조회 실패:', err.message);
        return null;
      }
    }

    async function rawgDetail(id) {
      const key = getRawgKey();
      try {
        const res = await fetch(`https://api.rawg.io/api/games/${id}?key=${encodeURIComponent(key)}`);
        if (!res.ok) throw new Error(`RAWG ${res.status}`);
        return await res.json();
      } catch {
        return null;
      }
    }

    function renderLookupResults(results) {
      const box = $('lookupResults');
      box.innerHTML = '';
      if (!results || !results.length) {
        box.innerHTML = '<div class="muted" style="padding:6px">검색 결과 없음</div>';
        return;
      }
      results.forEach((r) => {
        const div = document.createElement('div');
        div.className = 'lookup-result';
        const genres = translateGenres(r.genres).join(', ');
        div.innerHTML = `
          <img src="${r.background_image || ''}" alt="" onerror="this.style.opacity=0.2" />
          <div style="flex:1; min-width:0">
            <strong>${escapeHtml(r.name)}</strong>
            <div class="meta">${escapeHtml(r.released || '')} · ${escapeHtml(genres)}</div>
          </div>
        `;
        div.addEventListener('click', async () => {
          box.innerHTML = '<div class="muted" style="padding:6px">상세 정보 불러오는 중...</div>';
          const detail = await rawgDetail(r.id);
          await applyLookupToForm(detail || r);
          box.innerHTML = '';
        });
        box.appendChild(div);
      });
    }

    async function applyLookupToForm(game) {
      $('title').value = game.name || $('title').value;
      $('genres').value = translateGenres(game.genres).join(', ');
      $('released').value = game.released || '';
      $('coverImage').value = game.background_image || '';

      const rawDesc = game.description_raw || game.description || '';
      const truncated = rawDesc.length > 600 ? rawDesc.slice(0, 600) + '…' : rawDesc;
      if (!truncated) {
        $('description').value = '';
        return;
      }
      $('description').value = '번역 중...';
      const ko = await translateToKorean(truncated);
      $('description').value = ko;
    }

    // === Screenshots ===
    async function handleScreenshotInput(files) {
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        const dataUrl = await fileToDataURL(file);
        state.screenshotsBuffer.push(dataUrl);
      }
      renderScreenshotPreview();
    }

    function renderScreenshotPreview() {
      const box = $('screenshotPreview');
      box.innerHTML = '';
      state.screenshotsBuffer.forEach((src, idx) => {
        const t = document.createElement('div');
        t.className = 'thumb';
        t.innerHTML = `<img src="${src}" alt="" /><button type="button" class="remove" data-idx="${idx}">×</button>`;
        box.appendChild(t);
      });
      box.querySelectorAll('.remove').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.screenshotsBuffer.splice(Number(btn.dataset.idx), 1);
          renderScreenshotPreview();
        });
      });
    }

    // === Form submit ===
    function resetForm() {
      $('gameForm').reset();
      $('editingId').value = '';
      $('coverImage').value = '';
      state.screenshotsBuffer = [];
      renderScreenshotPreview();
      $('lookupResults').innerHTML = '';
      $('submitBtn').textContent = '추가';
    }

    function buildGameFromForm() {
      const id = $('editingId').value || uid();
      const title = $('title').value.trim();
      const genres = $('genres').value.split(',').map((g) => g.trim()).filter(Boolean);
      return {
        id,
        title,
        status: $('status').value,
        platform: $('platform').value,
        genres,
        released: $('released').value.trim(),
        description: $('description').value.trim(),
        note: $('note').value.trim(),
        background_image: $('coverImage').value || '',
        screenshots: state.screenshotsBuffer.slice(),
        createdAt: Date.now(),
      };
    }

    function submitGame(e) {
      e.preventDefault();
      if (!state.currentProfile) {
        alert('먼저 프로필을 만드세요.');
        return;
      }
      const game = buildGameFromForm();
      if (!game.title || !game.platform) return;

      const editingId = $('editingId').value;
      if (editingId) {
        const idx = state.games.findIndex((g) => g.id === editingId);
        if (idx !== -1) {
          game.createdAt = state.games[idx].createdAt;
          state.games[idx] = game;
        }
      } else {
        state.games.unshift(game);
      }
      saveGames();
      resetForm();
      renderAll();
    }

    function editGame(id) {
      const g = state.games.find((x) => x.id === id);
      if (!g) return;
      $('editingId').value = g.id;
      $('title').value = g.title;
      $('status').value = g.status;
      $('platform').value = g.platform;
      $('genres').value = (g.genres || []).join(', ');
      $('released').value = g.released || '';
      $('description').value = g.description || '';
      $('note').value = g.note || '';
      $('coverImage').value = g.background_image || '';
      state.screenshotsBuffer = (g.screenshots || []).slice();
      renderScreenshotPreview();
      $('submitBtn').textContent = '수정 저장';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteGame(id) {
      const g = state.games.find((x) => x.id === id);
      if (!g) return;
      if (!confirm(`"${g.title}" 을(를) 삭제할까요?`)) return;
      state.games = state.games.filter((x) => x.id !== id);
      saveGames();
      renderAll();
    }

    // === Rendering ===
    function renderStats() {
      const cleared = state.games.filter((g) => g.status === 'cleared').length;
      const playing = state.games.filter((g) => g.status === 'playing').length;
      const planned = state.games.filter((g) => g.status === 'planned').length;
      $('stats').innerHTML = `
        <span class="stat-pill total">전체 ${state.games.length}</span>
        <span class="stat-pill cleared">클리어 ${cleared}</span>
        <span class="stat-pill playing">플레이 중 ${playing}</span>
        <span class="stat-pill planned">예정 ${planned}</span>
      `;
    }

    function renderPlatformFilter() {
      const sel = $('filterPlatform');
      const current = sel.value || 'all';
      const platforms = Array.from(new Set(state.games.map((g) => g.platform).filter(Boolean))).sort();
      sel.innerHTML = '<option value="all">전체 플랫폼</option>' +
        platforms.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
      if ([...sel.options].some((o) => o.value === current)) sel.value = current;
    }

    function filteredGames() {
      const q = $('searchInput').value.toLowerCase().trim();
      const fs = $('filterStatus').value;
      const fp = $('filterPlatform').value;
      return state.games.filter((g) => {
        if (fs !== 'all' && g.status !== fs) return false;
        if (fp !== 'all' && g.platform !== fp) return false;
        if (q) {
          const hay = [g.title, ...(g.genres || []), g.platform, g.note, g.description].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function youtubeSearchUrl(title) {
      const q = encodeURIComponent(`${title} 공략`);
      return `https://www.youtube.com/results?search_query=${q}`;
    }

    function gameCardHTML(g) {
      const shots = (g.screenshots || []).slice(0, 4).map((s, i) => `<img src="${s}" data-id="${g.id}" data-idx="${i}" class="shot-thumb" alt="" />`).join('');
      const cover = g.background_image
        ? `<div class="cover" style="background-image:url('${g.background_image.replace(/'/g, "\\'")}')"></div>`
        : '';
      const genres = (g.genres || []).map((x) => `<span class="badge">${escapeHtml(x)}</span>`).join('');
      return `
        <article class="game-card status-${g.status}">
          ${cover}
          <div class="body">
            <h3>${escapeHtml(g.title)}</h3>
            <div class="badges">
              <span class="badge status-${g.status}">${statusLabel(g.status)}</span>
              ${g.platform ? `<span class="badge">${escapeHtml(g.platform)}</span>` : ''}
              ${genres}
            </div>
            <div class="info">
              ${g.released ? `📅 ${escapeHtml(g.released)}` : ''}
            </div>
            ${g.description ? `<p class="desc">${escapeHtml(g.description)}</p>` : ''}
            ${g.note ? `<p class="desc" style="color:#cbd0e0">📝 ${escapeHtml(g.note)}</p>` : ''}
            ${shots ? `<div class="shots">${shots}</div>` : ''}
            <div class="card-actions">
              <a class="youtube" href="${youtubeSearchUrl(g.title)}" target="_blank" rel="noreferrer noopener">▶ 공략</a>
              <button type="button" class="ghost" data-action="edit" data-id="${g.id}">수정</button>
              <button type="button" class="ghost danger" data-action="delete" data-id="${g.id}">삭제</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderList() {
      const list = filteredGames();
      const container = $('gameList');
      container.innerHTML = list.map(gameCardHTML).join('');
      $('emptyState').classList.toggle('hidden', state.games.length > 0);

      container.querySelectorAll('[data-action="edit"]').forEach((b) => {
        b.addEventListener('click', () => editGame(b.dataset.id));
      });
      container.querySelectorAll('[data-action="delete"]').forEach((b) => {
        b.addEventListener('click', () => deleteGame(b.dataset.id));
      });
      container.querySelectorAll('.shot-thumb').forEach((img) => {
        img.addEventListener('click', () => openLightbox(img.src));
      });
    }

    function renderAll() {
      renderStats();
      renderPlatformFilter();
      renderList();
    }

    function openLightbox(src) {
      const div = document.createElement('div');
      div.className = 'lightbox';
      div.innerHTML = `<img src="${src}" alt="" />`;
      div.addEventListener('click', () => div.remove());
      document.body.appendChild(div);
    }

    // === Init ===
    function init() {
      state.profiles = loadProfiles();
      if (!state.profiles.length) {
        state.profiles = ['기본 프로필'];
        saveProfiles(state.profiles);
      }
      const saved = localStorage.getItem(KEYS.currentProfile);
      state.currentProfile = state.profiles.includes(saved) ? saved : state.profiles[0];
      state.games = loadGames(state.currentProfile);

      refreshProfileSelect();
      renderAll();

      // Profile events
      $('profileSelect').addEventListener('change', (e) => switchProfile(e.target.value));
      $('newProfileBtn').addEventListener('click', () => {
        const name = prompt('새 프로필 이름:');
        if (name) createProfile(name);
      });
      $('deleteProfileBtn').addEventListener('click', deleteCurrentProfile);

      // Settings panel
      const rawgKeyInput = $('rawgKey');
      rawgKeyInput.value = localStorage.getItem(KEYS.rawgKey) || '';
      updateRawgKeyStatus();
      $('settingsBtn').addEventListener('click', () => {
        $('settingsPanel').classList.toggle('hidden');
      });
      $('saveRawgKey').addEventListener('click', () => {
        const v = rawgKeyInput.value.trim();
        if (v) localStorage.setItem(KEYS.rawgKey, v);
        else localStorage.removeItem(KEYS.rawgKey);
        updateRawgKeyStatus();
      });

      // Auto-search: 게임명 입력 시 RAWG와 실시간 싱크 (debounce + 한글 자동 번역)
      let searchSeq = 0;
      let debounceTimer = null;
      const titleInput = $('title');
      const resultsBox = $('lookupResults');

      const runSearch = async (raw) => {
        const seq = ++searchSeq;
        const q = raw.trim();
        if (q.length < 2) { resultsBox.innerHTML = ''; return; }
        resultsBox.innerHTML = '<div class="muted" style="padding:6px">검색 중...</div>';
        const engQuery = await toEnglish(q);
        if (seq !== searchSeq) return;                  // 사용자가 이미 더 입력함 — 폐기
        const results = await rawgSearch(engQuery);
        if (seq !== searchSeq) return;
        renderLookupResults(results || []);
      };

      titleInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const v = e.target.value;
        debounceTimer = setTimeout(() => runSearch(v), 400);
      });

      // 입력 영역 바깥 클릭 시 결과 닫기
      document.addEventListener('click', (e) => {
        if (!titleInput.contains(e.target) && !resultsBox.contains(e.target)) {
          resultsBox.innerHTML = '';
        }
      });
      // 다시 포커스되면 마지막 쿼리로 검색 (입력값이 남아 있을 때)
      titleInput.addEventListener('focus', () => {
        if (titleInput.value.trim().length >= 2 && !resultsBox.innerHTML) {
          runSearch(titleInput.value);
        }
      });

      // Form
      $('gameForm').addEventListener('submit', submitGame);
      $('resetBtn').addEventListener('click', resetForm);
      $('screenshots').addEventListener('change', async (e) => {
        await handleScreenshotInput(e.target.files);
        e.target.value = '';
      });

      // Filters
      $('searchInput').addEventListener('input', renderList);
      $('filterStatus').addEventListener('change', renderList);
      $('filterPlatform').addEventListener('change', renderList);
    }

    function updateRawgKeyStatus() {
      const userKey = localStorage.getItem(KEYS.rawgKey);
      $('rawgKeyStatus').textContent = userKey
        ? '✅ 본인 RAWG 키 사용 중. "정보 불러오기"로 자동 채움이 가능합니다.'
        : '🔹 기본 내장 키 사용 중. 본인 키를 입력하면 그쪽이 우선 사용됩니다.';
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
