name: MC Verify
on:
  push:
    paths:
      - '.github/workflows/mc-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Metacritic scores live
        run: node .github/mc-verify.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mc-verify-result.json
          git commit -m "Metacritic live verify result [skip ci]" || echo "no change"
          git push origin HEAD:${GITHUB_REF_NAME}
